name: Compilar OPL Next ELF

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build PS2 ELF

    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ps2dev/ps2dev:latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar ferramentas
        shell: sh
        run: |
          echo "========================================"
          echo "INSTALANDO FERRAMENTAS"
          echo "========================================"

          apk add --no-cache make

          echo ""
          echo "Make instalado:"
          command -v make
          make --version

      - name: Preparar ambiente PS2DEV
        shell: sh
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export GSKIT=$PS2DEV/gsKit

          export PATH=/usr/local/bin:/usr/bin:/bin:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin:$PATH

          echo "========================================"
          echo "AMBIENTE PS2DEV"
          echo "========================================"

          echo "PS2DEV=$PS2DEV"
          echo "PS2SDK=$PS2SDK"
          echo "GSKIT=$GSKIT"

          echo ""
          echo "Compilador:"
          command -v mips64r5900el-ps2-elf-gcc

          echo ""
          echo "Make:"
          command -v make

      - name: Limpar
        shell: sh
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export GSKIT=$PS2DEV/gsKit

          export PATH=/usr/local/bin:/usr/bin:/bin:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin:$PATH

          echo "========================================"
          echo "LIMPANDO BUILD"
          echo "========================================"

          make clean || true

      - name: Compilar
        shell: sh
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export GSKIT=$PS2DEV/gsKit

          export PATH=/usr/local/bin:/usr/bin:/bin:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin:$PATH

          echo "========================================"
          echo "COMPILANDO OPL NEXT"
          echo "========================================"

          make

      - name: Verificar ELF
        shell: sh
        run: |
          echo "========================================"
          echo "VERIFICANDO ELF"
          echo "========================================"

          if [ ! -f OPL_NEXT_BETA.ELF ]; then
            echo "ERRO: OPL_NEXT_BETA.ELF nao foi gerado!"
            exit 1
          fi

          echo ""
          echo "ELF gerado com sucesso:"
          ls -lh OPL_NEXT_BETA.ELF

          echo ""
          echo "Tipo do arquivo:"
          file OPL_NEXT_BETA.ELF

      - name: Publicar ELF
        uses: actions/upload-artifact@v4
        with:
          name: OPL_NEXT_BETA_ELF
          path: OPL_NEXT_BETA.ELF
          if-no-files-found: error
