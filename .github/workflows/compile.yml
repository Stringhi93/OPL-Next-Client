name: Compilar OPL Next ELF

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build PS2 ELF
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ps2dev/ps2dev:latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verificar ambiente PS2DEV
        run: |
          echo "========================================"
          echo "PS2DEV ENVIRONMENT"
          echo "========================================"

          echo "PS2DEV=$PS2DEV"
          echo "PS2SDK=$PS2SDK"
          echo "PATH=$PATH"

          echo ""
          echo "Make:"
          command -v make
          make --version

          echo ""
          echo "PS2 compiler:"
          command -v mips64r5900el-ps2-elf-gcc
          mips64r5900el-ps2-elf-gcc --version

      - name: Build ELF
        run: |
          echo "========================================"
          echo "BUILDING OPL NEXT"
          echo "========================================"

          make clean
          make

      - name: Verify ELF
        run: |
          echo "========================================"
          echo "VERIFY ELF"
          echo "========================================"

          test -f OPL_NEXT_BETA.ELF

          ls -lh OPL_NEXT_BETA.ELF

          file OPL_NEXT_BETA.ELF

      - name: Upload ELF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OPL_NEXT_BETA_ELF
          path: OPL_NEXT_BETA.ELF