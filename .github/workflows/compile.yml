name: Compilar OPL Next ELF

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build ELF File
        uses: addnab/docker-run-action@v3
        with:
          image: ps2dev/ps2dev:latest
          options: -v ${{ github.workspace }}:/src -w /src
          run: |
            apk add --no-cache make gcc musl-dev
            export PS2DEV=/usr/local/ps2dev
            export PS2SDK=$PS2DEV/ps2sdk
            export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2SDK/bin
            make

      - name: Upload ELF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OPL_NEXT_BETA_ELF
          path: OPL_NEXT_BETA.ELF
