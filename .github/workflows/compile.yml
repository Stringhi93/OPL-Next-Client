name: Procurar metodo IRX

on:
  workflow_dispatch:

jobs:
  check:
    name: Procurar exemplos IRX
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ps2dev/ps2dev:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Procurar exemplos
        shell: sh
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk

          echo "========================================"
          echo "PROCURANDO SIFEXECCMODULEBUFFER"
          echo "========================================"

          grep -R "SifExecModuleBuffer" \
            "$PS2SDK/samples" \
            "$PS2SDK" \
            2>/dev/null | head -50 || true

          echo ""
          echo "========================================"
          echo "PROCURANDO addbin"
          echo "========================================"

          find "$PS2DEV" \
            -type f \
            \( -iname '*addbin*' -o -iname '*bin2*' \) \
            -print 2>/dev/null || true

          echo ""
          echo "========================================"
          echo "PROCURANDO EMBED"
          echo "========================================"

          grep -R -i "embedded.*irx\|irx.*embedded" \
            "$PS2SDK/samples" \
            2>/dev/null | head -50 || true

          echo ""
          echo "========================================"
          echo "MAKEFILES COM IRX"
          echo "========================================"

          grep -R -l "\.irx" \
            "$PS2SDK/samples" \
            2>/dev/null | head -50 || true

          echo ""
          echo "========================================"
          echo "FIM"
          echo "========================================"
