name: Compilar OPL Next ELF

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build PS2 ELF

    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ps2dev/ps2dev:latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar ferramentas
        shell: sh
        run: |
          echo "========================================"
          echo "INSTALANDO FERRAMENTAS"
          echo "========================================"

          apk add --no-cache make

          echo ""
          echo "Make:"
          command -v make
          make --version

      - name: Diagnosticar ambiente PS2DEV
        shell: sh
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export GSKIT=$PS2DEV/gsKit

          export PATH=/usr/local/bin:/usr/bin:/bin:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin:$PATH

          echo "========================================"
          echo "AMBIENTE PS2DEV"
          echo "========================================"

          echo "PS2DEV=$PS2DEV"
          echo "PS2SDK=$PS2SDK"
          echo "GSKIT=$GSKIT"

          echo ""
          echo "========================================"
          echo "COMPILADOR"
          echo "========================================"

          command -v mips64r5900el-ps2-elf-gcc

          echo ""
          mips64r5900el-ps2-elf-gcc --version

          echo ""
          echo "========================================"
          echo "MAKE"
          echo "========================================"

          command -v make
          make --version

          echo ""
          echo "========================================"
          echo "CONTEUDO DO PS2DEV"
          echo "========================================"

          ls -la "$PS2DEV" || true

          echo ""
          echo "========================================"
          echo "CONTEUDO DO GSKIT"
          echo "========================================"

          if [ -d "$GSKIT" ]; then
            ls -la "$GSKIT"
          else
            echo "DIRETORIO GSKIT NAO EXISTE:"
            echo "$GSKIT"
          fi

          echo ""
          echo "========================================"
          echo "PROCURANDO GSKIT.H"
          echo "========================================"

          find "$PS2DEV" \
            -type f \
            -name "gsKit.h" \
            -print 2>/dev/null || true

          echo ""
          echo "========================================"
          echo "PROCURANDO GSKIT HEADERS"
          echo "========================================"

          find "$PS2DEV" \
            -type f \
            \( \
              -name "gsKit.h" \
              -o -name "gsInit.h" \
              -o -name "gsInline.h" \
              -o -name "gsCore.h" \
              -o -name "gsToolkit.h" \
              -o -name "dmaKit.h" \
            \) \
            -print 2>/dev/null || true

          echo ""
          echo "========================================"
          echo "PROCURANDO BIBLIOTECAS GSKIT"
          echo "========================================"

          find "$PS2DEV" \
            -type f \
            \( \
              -name "libgskit.a" \
              -o -name "libgskit_toolkit.a" \
              -o -name "libdmakit.a" \
            \) \
            -print 2>/dev/null || true

          echo ""
          echo "========================================"
          echo "FIM DO DIAGNOSTICO"
          echo "========================================"

      - name: Parar para analisar ambiente
        shell: sh
        run: |
          echo "========================================"
          echo "DIAGNOSTICO CONCLUIDO"
          echo "========================================"
          echo ""
          echo "O build foi pausado propositalmente."
          echo "Nenhum arquivo do projeto sera compilado nesta etapa."
          echo ""
          echo "Os caminhos reais do gsKit foram impressos acima."
          echo ""
          exit 0
