name: Compilar OPL Next ELF

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build PS2 ELF
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ps2dev/ps2dev:latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Preparar ambiente PS2DEV
        shell: sh
        run: |
          echo "========================================"
          echo "PREPARANDO AMBIENTE PS2DEV"
          echo "========================================"

          echo "Instalando ferramentas de compilacao..."
          apk add --no-cache build-base

          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export GSKIT=$PS2DEV/gsKit

          export PATH=$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin:$PATH

          echo ""
          echo "PS2DEV=$PS2DEV"
          echo "PS2SDK=$PS2SDK"
          echo "GSKIT=$GSKIT"

          echo ""
          echo "PATH=$PATH"

          echo ""
          echo "========================================"
          echo "VERIFICANDO MAKE"
          echo "========================================"

          command -v make
          make --version

          echo ""
          echo "========================================"
          echo "VERIFICANDO COMPILADOR PS2"
          echo "========================================"

          command -v mips64r5900el-ps2-elf-gcc
          mips64r5900el-ps2-elf-gcc --version

      - name: Build ELF
        shell: sh
        run: |
          echo "========================================"
          echo "BUILDING OPL NEXT"
          echo "========================================"

          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export GSKIT=$PS2DEV/gsKit

          export PATH=$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin:$PATH

          echo ""
          echo "PS2DEV=$PS2DEV"
          echo "PS2SDK=$PS2SDK"

          echo ""
          echo "Make:"
          command -v make

          echo ""
          echo "Compilador:"
          command -v mips64r5900el-ps2-elf-gcc

          echo ""
          echo "Limpando build anterior..."
          make clean

          echo ""
          echo "Iniciando compilacao..."
          make

      - name: Verify ELF
        shell: sh
        run: |
          echo "========================================"
          echo "VERIFICANDO ELF"
          echo "========================================"

          if [ ! -f OPL_NEXT_BETA.ELF ]; then
            echo "ERRO: OPL_NEXT_BETA.ELF nao foi gerado!"
            exit 1
          fi

          echo ""
          echo "ELF encontrado com sucesso:"
          ls -lh OPL_NEXT_BETA.ELF

          echo ""
          echo "Informacoes do arquivo:"
          file OPL_NEXT_BETA.ELF

      - name: Upload ELF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OPL_NEXT_BETA_ELF
          path: OPL_NEXT_BETA.ELF
          if-no-files-found: error