name: Compilar OPL Next ELF

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build PS2 ELF

    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ps2dev/ps2dev:latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar ambiente PS2DEV
        shell: sh
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export GSKIT=$PS2DEV/gsKit

          export PATH=$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin:$PATH

          echo "PS2DEV=$PS2DEV"
          echo "PS2SDK=$PS2SDK"
          echo "GSKIT=$GSKIT"

          echo ""
          echo "Compilador:"
          command -v mips64r5900el-ps2-elf-gcc

          echo ""
          echo "Make:"
          command -v make

      - name: Limpar
        shell: sh
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export GSKIT=$PS2DEV/gsKit

          export PATH=$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin:$PATH

          make clean

      - name: Compilar
        shell: sh
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export GSKIT=$PS2DEV/gsKit

          export PATH=$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin:$PATH

          make

      - name: Verificar ELF
        shell: sh
        run: |
          if [ ! -f OPL_NEXT_BETA.ELF ]; then
            echo "ERRO: ELF nao encontrado!"
            exit 1
          fi

          echo "ELF gerado:"
          ls -lh OPL_NEXT_BETA.ELF

          echo ""
          file OPL_NEXT_BETA.ELF

      - name: Publicar ELF
        uses: actions/upload-artifact@v4
        with:
          name: OPL_NEXT_BETA_ELF
          path: OPL_NEXT_BETA.ELF
          if-no-files-found: error
