name: Verificar ferramentas PS2SDK

on:
  workflow_dispatch:

jobs:
  check:
    name: Verificar ferramentas
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ps2dev/ps2dev:latest

    steps:
      - name: Verificar ambiente
        shell: sh
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk

          export PATH=/usr/local/bin:/usr/bin:/bin:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin:$PATH

          echo "========================================"
          echo "FERRAMENTAS PS2SDK"
          echo "========================================"

          echo ""
          echo "bin2s:"
          command -v bin2s || echo "NAO ENCONTRADO"

          echo ""
          echo "bin2obj:"
          command -v bin2obj || echo "NAO ENCONTRADO"

          echo ""
          echo "elf2irx:"
          command -v elf2irx || echo "NAO ENCONTRADO"

          echo ""
          echo "ps2-packer:"
          command -v ps2-packer || echo "NAO ENCONTRADO"

          echo ""
          echo "tools:"
          find "$PS2DEV" -type f -perm -111 \
            \( -name 'bin2s' \
            -o -name 'bin2obj' \
            -o -name 'elf2irx' \
            -o -name 'ps2-packer' \) \
            -print 2>/dev/null || true

          echo ""
          echo "========================================"
          echo "IRX DISPONIVEIS"
          echo "========================================"

          find "$PS2SDK/iop/irx" -maxdepth 1 -type f \
            \( -name '*.irx' \) \
            -print | sort

          echo ""
          echo "========================================"
          echo "VERIFICACAO CONCLUIDA"
          echo "========================================"
