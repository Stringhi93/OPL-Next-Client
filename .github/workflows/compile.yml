name: Verificar PS2SDK Rede

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Verificar ambiente PS2
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ps2dev/ps2dev:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Make
        shell: sh
        run: |
          apk add --no-cache make

      - name: Verificar rede PS2SDK
        shell: sh
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export GSKIT=$PS2DEV/gsKit

          export PATH=/usr/local/bin:/usr/bin:/bin:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin:$PATH

          echo "========================================"
          echo "PS2SDK"
          echo "========================================"

          echo "PS2DEV=$PS2DEV"
          echo "PS2SDK=$PS2SDK"

          echo ""
          echo "NETMAN:"
          find "$PS2DEV" -iname '*netman*' -print 2>/dev/null || true

          echo ""
          echo "SMAP:"
          find "$PS2DEV" -iname '*smap*' -print 2>/dev/null || true

          echo ""
          echo "PS2IP:"
          find "$PS2DEV" -iname '*ps2ip*' -print 2>/dev/null || true

          echo ""
          echo "DEV9:"
          find "$PS2DEV" -iname '*dev9*' -print 2>/dev/null || true

          echo ""
          echo "BIBLIOTECAS:"
          find "$PS2DEV" \
            \( -name 'libnetman.a' \
            -o -name 'libps2ip.a' \
            -o -name 'libsmap.a' \
            -o -name 'libdev9.a' \) \
            -print 2>/dev/null || true

          echo ""
          echo "HEADERS:"
          find "$PS2DEV" \
            \( -name 'netman.h' \
            -o -name 'ps2ip.h' \
            -o -name 'smap.h' \
            -o -name 'dev9.h' \) \
            -print 2>/dev/null || true

          echo ""
          echo "========================================"
          echo "VERIFICACAO CONCLUIDA"
          echo "========================================"
