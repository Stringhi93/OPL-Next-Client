name: Compilar OPL Next

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build PS2 ELF

    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ps2dev/ps2dev:latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar ferramentas
        shell: sh
        run: |
          apk add --no-cache make

          echo "========================================"
          echo "FERRAMENTAS"
          echo "========================================"

          echo "make:"
          command -v make
          make --version

          echo ""
          echo "bin2s:"
          command -v bin2s || true

      - name: Preparar ambiente PS2DEV
        shell: sh
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export GSKIT=$PS2DEV/gsKit

          export PATH=/usr/local/bin:/usr/bin:/bin:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin:$PATH

          echo "========================================"
          echo "AMBIENTE PS2DEV"
          echo "========================================"

          echo "PS2DEV=$PS2DEV"
          echo "PS2SDK=$PS2SDK"
          echo "GSKIT=$GSKIT"

          echo ""
          echo "Compilador:"
          command -v mips64r5900el-ps2-elf-gcc

          echo ""
          echo "bin2s:"
          command -v bin2s

      - name: Verificar arquivos de rede
        shell: sh
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk

          echo "========================================"
          echo "ARQUIVOS DE REDE"
          echo "========================================"

          echo ""
          echo "DEV9:"
          ls -lh "$PS2SDK/iop/irx/ps2dev9.irx"

          echo ""
          echo "NETMAN:"
          ls -lh "$PS2SDK/iop/irx/netman.irx"

          echo ""
          echo "SMAP:"
          ls -lh "$PS2SDK/iop/irx/smap.irx"

          echo ""
          echo "PS2IP:"
          ls -lh "$PS2SDK/iop/irx/ps2ip.irx"

      - name: Limpar
        shell: sh
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk

          echo "========================================"
          echo "LIMPANDO"
          echo "========================================"

          make clean || true

      - name: Compilar
        shell: sh
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export GSKIT=$PS2DEV/gsKit

          export PATH=/usr/local/bin:/usr/bin:/bin:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2SDK/bin:$PATH

          echo "========================================"
          echo "COMPILANDO OPL NEXT"
          echo "========================================"

          make

      - name: Verificar ELF
