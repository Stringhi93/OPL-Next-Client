name: Compilar OPL Next ELF

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:latest
    steps:
      - name: Baixar Codigo
        uses: actions/checkout@v4

      - name: Compilar ELF
        run: |
          make

      - name: Salvar o Arquivo .ELF
        uses: actions/upload-artifact@v4
        with:
          name: OPL_NEXT_BETA_ELF
          path: OPL_NEXT_BETA.ELF
