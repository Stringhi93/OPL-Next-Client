name: Compilar OPL Next

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build PS2 ELF
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ps2dev/ps2dev:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar ambiente
        shell: sh
        run: |
          apk add --no-cache make

          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export GSKIT=$PS2DEV/gsKit

          export PATH=/usr/local/bin:/usr/bin:/bin:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin:$PATH

          echo "========================================"
          echo "AMBIENTE PS2DEV"
          echo "========================================"

          echo "PS2DEV=$PS2DEV"
          echo "PS2SDK=$PS2SDK"

          echo ""
          echo "Compilador:"
          command -v mips64r5900el-ps2-elf-gcc

          echo ""
          echo "Make:"
          command -v make

          echo ""
          echo "bin2s:"
          command -v bin2s

      - name: Verificar arquivos de rede
        shell: sh
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk

          echo "========================================"
          echo "ARQUIVOS DE REDE"
          echo "========================================"

          ls -lh "$PS2SDK/iop/irx/ps2dev9.irx"
          ls -lh "$PS2SDK/iop/irx/netman.irx"
          ls -lh "$PS2SDK/iop/irx/smap.irx"
          ls -lh "$PS2SDK/iop/irx/ps2ip.irx"

      - name: Limpar
        shell: sh
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export GSKIT=$PS2DEV/gsKit

          export PATH=/usr/local/bin:/usr/bin:/bin:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin:$PATH

          make clean || true

      - name: Compilar
        shell: sh
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export GSKIT=$PS2DEV/gsKit

          export PATH=/usr/local/bin:/usr/bin:/bin:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin:$PATH

          echo "========================================"
          echo "COMPILANDO OPL NEXT"
          echo "========================================"

          make

      - name: Verificar ELF
        shell: sh
        run: |
          echo "========================================"
          echo "VERIFICANDO ELF"
          echo "========================================"

          if [ ! -f OPL_NEXT_BETA.ELF ]; then
            echo "ERRO: ELF nao foi gerado!"
            exit 1
          fi

          echo ""
          echo "ELF GERADO COM SUCESSO:"
          ls -lh OPL_NEXT_BETA.ELF

      - name: Publicar ELF
        uses: actions/upload-artifact@v4
        with:
          name: OPL_NEXT_BETA_ELF
          path: OPL_NEXT_BETA.ELF
          if-no-files-found: error
